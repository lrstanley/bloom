# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

vars:
  MODULES: [".", _examples, _integration]
  MODRELEASE: github.com/lrstanley/x/cmd/modrelease@latest

set: [errexit, nounset, pipefail]

tasks:
  # go tasks, run across every module.
  license:
    desc: add license headers
    cmds:
      - curl -sL https://liam.sh/-/gh/g/license-header.sh | bash -s
  tidy:
    desc: run go mod tidy
    cmds:
      - for: { var: MODULES, as: MODULE }
        cmd: cd {{.MODULE}} && go mod tidy
  up:
    desc: upgrade all go and bun dependencies
    cmds:
      - for: { var: MODULES, as: MODULE }
        cmd: cd {{.MODULE}} && go get -u -t ./... && go mod tidy
      - cd docs && bunx npm-check-updates -u && bun install
  # CI runs this too, through lrstanley/.github's go test workflow.
  test:
    desc: run tests with the race detector, several times over
    env:
      GORACE: exitcode=1 halt_on_error=1
    cmds:
      - for: { var: MODULES, as: MODULE }
        cmd: cd {{.MODULE}} && go test -v -race -timeout 3m -count 3 -cpu 1,4 {{default "./..." .CLI_ARGS}}
  demos:
    desc: record each example's tour to docs/public/demos/<example>.webp, for the docs pages (needs ffmpeg)
    dir: _examples
    env:
      STEEP_EXPORT_MODE: "on"
    cmds:
      - go test -count 1 ./...
  # run with --github-release and --highlights, so the GitHub release is created with notes. first run the plan, and
  # read the changelog it prints. then write the highlights file, outside the repo so it isn't committed: a short
  # summary of the notable changes. modrelease adds the changelog and the go get instructions itself, so don't repeat
  # them. both the plan and --apply need a GH_TOKEN that can create releases. for example:
  #   GH_TOKEN=$(gh auth token) task release -- patch --alpha --github-release --highlights /tmp/highlights.md
  #   GH_TOKEN=$(gh auth token) task release -- patch --alpha --github-release --highlights /tmp/highlights.md --apply
  release:
    desc: release the module, printing the plan unless given --apply (task release -- <version> [--apply])
    preconditions:
      - sh: test -n {{shellQuote .CLI_ARGS}}
        msg: "usage: task release -- <major|minor|patch|version> [--alpha|--beta|--rc] [--apply]"
    cmds:
      - go run {{.MODRELEASE}} {{.CLI_ARGS}}

  # the documentation site.
  docs:install:
    desc: install the docs' dependencies
    dir: docs
    cmds:
      - bun install
  docs:dev:
    desc: run the docs' dev server
    dir: docs
    deps: [docs:install]
    cmds:
      - bun run dev
  docs:build:
    desc: build the docs
    dir: docs
    deps: [docs:install]
    cmds:
      - bun run build
  docs:preview:
    desc: preview the built docs
    dir: docs
    deps: [docs:build]
    cmds:
      - bun run preview
